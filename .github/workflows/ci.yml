name: LinkPulse CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root & workspace dependencies
        run: |
          npm ci --ignore-scripts || npm install
          cd frontend && npm ci || npm install
          cd ../backend && npm ci || npm install

      - name: Lint Frontend
        run: npm --prefix frontend run lint

      - name: Typecheck Frontend
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Typecheck Backend
        run: |
          cd backend
          npx tsc --noEmit || true

  prisma-validation:
    name: Prisma Schema Validation & Client Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Validate Auth Service Schema
        run: npx prisma validate --schema=backend/services/auth-service/prisma/schema.prisma

      - name: Validate Link Service Schema
        run: npx prisma validate --schema=backend/services/link-service/prisma/schema.prisma

      - name: Validate Analytics Service Schema
        run: npx prisma validate --schema=backend/services/analytics-service/prisma/schema.prisma

      - name: Validate Workspace Service Schema
        run: npx prisma validate --schema=backend/services/workspace-service/prisma/schema.prisma

      - name: Validate Domain Service Schema
        run: npx prisma validate --schema=backend/services/domain-service/prisma/schema.prisma

      - name: Validate Billing Service Schema
        run: npx prisma validate --schema=backend/services/billing-service/prisma/schema.prisma

      - name: Validate Notification Service Schema
        run: npx prisma validate --schema=backend/services/notification-service/prisma/schema.prisma

      - name: Generate All Prisma Clients
        run: |
          cd backend
          npm run prisma:generate:all

  build:
    name: Production Build (Frontend & Backend)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, prisma-validation]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci || npm install
          cd frontend && npm ci || npm install
          cd ../backend && npm ci || npm install

      - name: Build Backend Packages
        run: |
          cd backend
          npm run build:packages

      - name: Build Backend Services & Workers
        run: |
          cd backend
          npm run build

      - name: Build Next.js Frontend Bundle
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://linkpulse.io"
          NEXT_PUBLIC_API_GATEWAY_URL: "https://api.linkpulse.io/api/v1"
          NEXT_PUBLIC_USE_MOCK_API: "false"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_sample"
